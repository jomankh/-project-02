<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="palette-container">
        <div class="swatch named-color">Named: Red</div>
        
        <div class="swatch hex-color">HEX: #790D16</div>
        
        <div class="swatch rgb-color">RGB: rgb(174, 196, 212)</div>
        
        <div class="swatch rgba-color">RGBA: rgba(121, 13, 22, 0.5)</div>
    </div>

    <div class="comparison-container">
        
        <div class="test-box use-opacity">
            <h3>useing Opacity: 0.5</h3>
            <p>This text will become transparent along with the box</p>
        </div>

        <div class="test-box use-rgba">
            <h3>useing RGBA</h3>
            <p>This text will remain clear and will not be affected by the box's background</p>
        </div>


</body>
</html>
